name: Deploy Redis to EC2 via ECR

on:
  push:
    paths:
      - 'backend_redis/**'
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: role--is

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t backend-redis:$IMAGE_TAG ./backend_redis
          docker tag backend-redis:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/backend-redis:$IMAGE_TAG
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/backend-redis:$IMAGE_TAG
      
          
      - name: Connect to EC2 
        env:
          IMAGE_TAG: ${{ github.sha }} 
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem
      
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@${{ secrets.EC2_HOST }} << EOF
            set -e
      
            cd /home/ubuntu/f1-store
      
            # Логін в ECR
            aws ecr get-login-password --region eu-north-1 \
            | docker login --username AWS --password-stdin 149591431224.dkr.ecr.eu-north-1.amazonaws.com
      
            # Перевіримо, чи підставився IMAGE_TAG:
            echo "IMAGE_TAG='$IMAGE_TAG'"
      
            # ВАЖЛИВО: Якщо IMAGE_TAG порожній, блокуй виконання!
            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: IMAGE_TAG is empty!"
              exit 1
            fi
      
            # Перевіримо, чи є docker-compose.yml:
            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: docker-compose.yml not found!"
              exit 2
            fi
      
            # Завантаження образу
            docker pull 149591431224.dkr.ecr.eu-north-1.amazonaws.com/backend-rds:$IMAGE_TAG
      
            # Оновлення docker-compose.yml
            sed -i '/backend_rds:/,/image:/s|image: .*|image: 149591431224.dkr.ecr.eu-north-1.amazonaws.com/backend-rds:'"$IMAGE_TAG"'|g' docker-compose.yml
      
            # Перезапуск через docker-compose
            docker-compose down 
            docker-compose up -d
      
            echo "$IMAGE_TAG" >> test.txt 
            uptime
          EOF
      
          rm key.pem
      