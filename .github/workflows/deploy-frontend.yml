name: Deploy Static Frontend to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
      

      - name: Build frontend
        run: npm run build
       

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::149591431224:role/github-actions-role
          aws-region: eu-north-1

      - name: Sync to S3
        run: aws s3 sync ./build s3://my--bucket--first --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3OS014DPUZY6A --paths "/*"
